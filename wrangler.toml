name = "ima-karate-worker"
main = "src/worker.js"
compatibility_date = "2025-04-01"

# ─────────────────────────────────────────────────────────────────────────────
#  Non-secret environment variables
# ─────────────────────────────────────────────────────────────────────────────
[vars]
ORIGIN = "https://ima-670b18.webflow.io"
IMG_BASE = "https://cdn.jsdelivr.net/gh/robh-autods/ima-karate-assets@main/"

# Demo mode — when "1", the belt-testing flow skips real Memberstack signup,
# Stripe checkout, and DocuSign, and instead routes through /belt-testing/mock-*
# pages so the whole journey can be demoed. Flip to "0" once Memberstack plan
# IDs + DocuSign JWT secrets are configured.
DEMO_MODE = "1"

# Memberstack — five one-time plan IDs, one per belt tier. Set these in the
# Cloudflare dashboard → Settings → Variables once you've created the plans
# in Memberstack, or override here.
MS_PLAN_TINY_TIGER   = "pln_replace_tiny_tiger"    # $60
MS_PLAN_WHITE_YELLOW = "pln_replace_white_yellow"  # $135
MS_PLAN_ORANGE_GREEN = "pln_replace_orange_green"  # $175
MS_PLAN_PURPLE_BLUE  = "pln_replace_purple_blue"   # $255
MS_PLAN_BROWN        = "pln_replace_brown"         # $365

# ─────────────────────────────────────────────────────────────────────────────
#  Secrets (set with `wrangler secret put <NAME>` or in the CF dashboard)
# ─────────────────────────────────────────────────────────────────────────────
#   MEMBERSTACK_SECRET_KEY       Memberstack Admin API secret (sk_...)
#   ADMIN_TOKEN                  Bearer token for /__admin/* routes.
#
#   DocuSign JWT auth (direct-from-Worker envelope sending — no Zapier):
#   DOCUSIGN_INTEGRATION_KEY     Integrator/Client ID (UUID) from DocuSign admin
#   DOCUSIGN_USER_GUID           Sending user's API user ID (UUID)
#   DOCUSIGN_ACCOUNT_ID          Account ID (ours: 6b65537a-a0f5-4bd6-802d-1daa34fe38d8)
#   DOCUSIGN_TEMPLATE_ID         Template ID for the belt-test waiver
#   DOCUSIGN_RSA_PRIVATE_KEY     PEM-formatted RSA private key (multi-line)
#   DOCUSIGN_BASE_URI            e.g. https://na4.docusign.net
#   DOCUSIGN_OAUTH_HOST          (optional) account.docusign.com | account-d.docusign.com
#   DOCUSIGN_CONNECT_HMAC_KEY    (optional) HMAC secret for Connect webhook auth
#
#   MS_WEBHOOK_SECRET            (optional) Memberstack webhook signing secret.
#   SCRIPT_UPLOAD_SECRET         (optional) SCRIPTS KV upload guard.

# ─────────────────────────────────────────────────────────────────────────────
#  KV namespaces
# ─────────────────────────────────────────────────────────────────────────────
# IMA_KARATE holds the reconfigurable belt-test config (key: "current").
# Namespace created in Cloudflare dashboard on 2026-08-11.
[[kv_namespaces]]
binding = "IMA_KARATE"
id = "b88e14c597dc445c8aa8061dba031e90"

# Custom domain routing is configured in the Cloudflare dashboard:
#   Workers & Pages → ima-karate-worker → Settings → Domains & Routes
#   → Add Custom Domain: ima.rob-hayes.com (zone rob-hayes.com must be on Cloudflare)
#
# Alternatively you can declare it here once the zone is on Cloudflare:
# [[routes]]
# pattern = "ima.rob-hayes.com/*"
# zone_name = "rob-hayes.com"

# Optional KV namespace for hot-patching bundled scripts.
# Create with: wrangler kv:namespace create SCRIPTS
# Then paste the returned id below and uncomment.
# [[kv_namespaces]]
# binding = "SCRIPTS"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
